# Watchlists: one per campaign. Drew edits this file; the app reads it.
#
# terms           phrases to match, whole word
# case_sensitive  terms that match only in the case written here
# priority        high = email right away; normal = 7 a.m. digest
#
# How a term matches:
# - Whole words only, any case unless listed under case_sensitive.
# - The last word may be plural: "license plate reader" matches
#   "License Plate Readers". So write terms in the singular; a plural term
#   doesn't match the singular.
# - A hyphen, with or without spaces around it, counts the same as a space:
#   "Los Gatos-Monte Sereno" matches "Los Gatos - Monte Sereno" and
#   "Los Gatos Monte Sereno".

surveillance:
  priority: high
  terms: [Flock, Flock Safety, ALPR, automated license plate, automatic license plate,
          license plate reader, license plate recognition,
          real-time crime center, ShotSpotter, SoundThinking, drone as first responder,
          surveillance use policy, surveillance technology,
          Verkada, Axon, RTIC, Real Time Intelligence Center, Fusus]
policing-contracts:
  priority: high
  terms: [law enforcement service, police services contract, contract for police services]
immigration:
  priority: high
  terms: [ICE, Immigration and Customs Enforcement, immigration enforcement, 287(g),
          immigration detainer, SB 54, sanctuary,
          DHS, Department of Homeland Security, federal agents, rapid response network, RRN]
  case_sensitive: [ICE]
tenants:
  priority: normal
  terms: [rent stabilization, rent control, just cause eviction, tenant protection,
          tenant anti-harassment, tenant anti-retaliation, tenant relocation,
          eviction prevention, anti-displacement, mobilehome rent, rent registry,
          tenant right to counsel, right to counsel, RTC]

# Categories added Oct 14, 2026.
jail:
  priority: normal
  terms: [Main Jail, Elmwood, Department of Correction, in-custody death, solitary confinement,
          restrictive housing, juvenile hall, pretrial release, jail population,
          detention facility, Custody Health]
data-centers:
  priority: normal
  terms: [data center, datacenter, hyperscale, colocation, server farm, large load,
          backup generator]
mobile-crisis-response:
  priority: normal
  terms: [mobile crisis, crisis response, crisis intervention, co-responder, alternative response,
          community responder, unarmed response, non-police response, behavioral health response,
          PERT, MCRT, CAHOOTS, Trusted Response Urgent Support Team]
  case_sensitive: [PERT, MCRT]
housing-and-homelessness:
  priority: normal
  terms: [homeless, homelessness, unhoused, encampment, safe parking, safe sleeping,
          interim housing, permanent supportive housing, emergency shelter, oversized vehicle,
          camping ordinance, Homekey, affordable housing, Housing Element, inclusionary housing,
          RHNA, NQL, Neighborhood Quality of Life]
