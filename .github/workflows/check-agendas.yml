name: Check agendas

on:
  schedule:
    # Every 2 hours at 17 past the odd UTC hours. 15:17 UTC is 7:17 a.m. Pacific
    # in winter (8:17 in summer), when the run sends the morning digest.
    - cron: "17 1-23/2 * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: Send one sample alert instead of checking agendas
        type: boolean
        default: false

permissions:
  contents: write  # to save state.json to the data branch

concurrency:
  group: check-agendas
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest

      - name: Send a test email
        if: inputs.test_email
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python -m needle.run --test-email

      - name: Get the state from the data branch
        if: ${{ !inputs.test_email }}
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data; then
            git show FETCH_HEAD:state.json > data/state.json
          else
            echo "No data branch yet; starting with an empty state."
          fi

      - name: Check agendas
        if: ${{ !inputs.test_email }}
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: python -m needle.run --state data/state.json

      # The data branch holds a single commit, replaced each run, so the repo
      # doesn't grow by a commit every 2 hours. The state is saved even if the
      # run failed partway, so alerts it already sent aren't sent twice.
      - name: Save the state to the data branch
        if: ${{ always() && !inputs.test_email && hashFiles('data/state.json') != '' }}
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          blob=$(git hash-object -w data/state.json)
          tree=$(printf '100644 blob %s\tstate.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "Save the state after run $GITHUB_RUN_NUMBER")
          git push --force origin "$commit:refs/heads/data"
