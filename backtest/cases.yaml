# Past items Haystack Needle should have caught, and when each first appeared.
#
# backtest/run.py (phase 2) replays these: for each case it fetches the
# body's agendas around `first_appearance`, runs the matcher with today's
# watchlists.yaml, and reports whether the item was caught, at which stage,
# and from where (title, item text or attachment).
#
# Fields
#   watchlist         which watchlist should fire
#   source            adapter and client/tenant, so the replay knows where to look
#   phase             the build phase whose adapter covers it
#   first_appearance  earliest agenda the item shows up on (meeting date)
#   stages            every agenda appearance found so far, oldest first;
#                     matter ids are Legistar MatterIds
#   title_match       does the item's first-appearance title match the current
#                     watchlists.yaml under the matcher rules in docs/scope.md?
#                     "no" means only item text or attachments could catch it.
#                     Comments say where the starting watchlist differed.
#   confirmed         false when a date comes from news coverage, not the agenda
#
# Dates are meeting dates. The agenda posts 72 hours before a regular meeting
# and 24 hours before a special one.

- id: saratoga-law-enforcement-2026
  summary: Saratoga weighs a 33% Sheriff contract increase against switching to Los Gatos-Monte Sereno Police
  watchlist: policing-contracts
  source: {adapter: civicplus, site: www.saratoga.ca.us}
  phase: 4  # or 2, if Saratoga is added early
  first_appearance: 2026-01-21
  stages:
    - date: 2025-11-17
      body: Finance Advisory Committee
      item: "Budget packet: \"Public Safety – increased by $664,240 as a result of Sheriff contract increases\""
      where: attachment, p. 15 of a 156-page packet  # should be a low-score digest match
      url: https://www.saratoga.ca.us/AgendaCenter/ViewFile/Agenda/_11172025-1384
    - date: 2026-01-21
      body: City Council
      item: "2.1 Multi-Jurisdictional Sheriff's Office Contract Negotiations Ad Hoc Committee"
      url: https://www.saratoga.ca.us/AgendaCenter/ViewFile/Agenda/_01212026-1401
    - date: 2026-01-27
      body: City Council (special meeting, 24-hour notice)
      item: "2. Sheriff Contract Renewal (Attachment A: 2026-27 Sheriff Cost Proposal)"
      url: https://www.saratoga.ca.us/AgendaCenter/ViewFile/Agenda/_01272026-1403
    - date: 2026-04-27
      body: City Council (special)
      item: "Saratoga Law Enforcement Options (Attachment E: Los Gatos Preliminary Proposal)"
      url: https://www.saratoga.ca.us/AgendaCenter/ViewFile/Agenda/_04272026-1434
    - date: 2026-06-03
      body: City Council
      item: "2.1 Review Law Enforcement Services Options of the Santa Clara County Sheriff and the Los Gatos - Monte Sereno Police Department"
      url: https://www.saratoga.ca.us/AgendaCenter/ViewFile/Agenda/_06032026-1444
    - date: 2026-08-11
      body: City Council (special)
      item: "1. Santa Clara County Sheriff Contract FY 2026-27 Service Levels"
      url: https://www.saratoga.ca.us/AgendaCenter/ViewFile/Agenda/_08112026-1461
    - date: 2026-09-19
      body: City Council (special)
      item: Law Enforcement Town Hall (repeated 2026-09-30)
      url: https://www.saratoga.ca.us/AgendaCenter/ViewFile/Agenda/_09192026-1477
    - date: 2026-10-07
      body: City Council
      item: "2.1 Law Enforcement Discussion and Agreement Determination"
      url: https://www.saratoga.ca.us/AgendaCenter/ViewFile/Agenda/_10072026-1482
  title_match: "yes"  # "sheriff"
  confirmed: true
  notes: >
    NBC Bay Area reported a 4-1 vote to stay with the Sheriff; the Oct 7 item is the
    likely vote (confirm in minutes). PDF text renders the department as
    "Los Gatos - Monte Sereno", "Los Gatos -Monte Sereno" and "Los Gatos Monte Sereno",
    which is why the matcher treats a hyphen and a space alike. The starting term
    "law enforcement services agreement" never appears; the agendas say "law enforcement
    agreement" and "law enforcement services", so the term is now "law enforcement
    service". Five of the eight stages were special
    meetings posted 24 hours ahead. The Oct 7 decision's title matches nothing; its
    item text matches "LGMSPD", "Los Gatos Monte Sereno" (hyphen rule) and "Sheriff's".

- id: county-alpr-surveillance-policy-2026
  summary: Board of Supervisors bars Flock as the Sheriff's license plate reader vendor (3-2)
  watchlist: surveillance
  source: {adapter: iqm2, site: sccgov.iqm2.com}
  phase: 3
  first_appearance: 2026-01-27
  stages:
    - date: 2026-01-27
      body: Board of Supervisors
      item: "Item 56: Consider recommendations relating to the Surveillance Use Policy for the Automated License Plate Readers for the City of Saratoga, the City of Cupertino, and the Town of Los Altos Hills."
      iqm2_meeting_id: 17578
      url: https://sccgov.iqm2.com/Citizens/Detail_Meeting.aspx?ID=17578
    - date: 2026-02-24
      body: Board of Supervisors
      item: "Held from January 27, 2026 (Item No. 56): Consider recommendations relating to the Surveillance Use Policy for the Automated License Plate Readers ... (Office of the Sheriff)"
      iqm2_meeting_id: 17581
      url: https://sccgov.iqm2.com/Citizens/Detail_Meeting.aspx?ID=17581
  title_match: "yes"  # "surveillance use policy", "automated license plate"; the starting watchlist matched too
  confirmed: true
  notes: >
    Attachments are named "Office of the Sheriff ALPR SUP Saratoga" (clean and redlined,
    one pair per city), plus a Feb 24 memo from Sheriff Jonsen. Not on the agendas of the
    Public Safety and Justice Committee (Jan 23, Feb 20) or the Board on Jan 13; the IQM2
    calendar checked starts in Jan 2026, so a 2025 appearance is still possible. The Feb 24
    outcome (3-2, excluding Flock) comes from news coverage, not the minutes: KQED,
    https://www.kqed.org/news/12074467. IQM2 has no matter id like Legistar's; the
    "Held from January 27, 2026 (Item No. 56)" prefix is what links the two stages.

- id: los-altos-hills-flock-2026
  summary: Los Altos Hills ends its Flock contract and takes 31 cameras offline
  watchlist: surveillance
  source: {adapter: civicclerk, tenant: losaltoshillsca}
  phase: 4
  first_appearance: 2025-09-18
  stages:
    - date: 2025-09-18
      body: City Council
      item: "External Access and Data Security Concerns re: Flock ALPR Data (Vice Mayor Bhateja)"
      civicclerk_agenda_id: 4848
    - date: 2026-01-15
      body: City Council
      item: "Discussion and Possible Direction on Terminating Agreement with FLOCK Safety for the Town's Automatic License Plate Reader System"
      civicclerk_agenda_id: 4957
  title_match: "yes"  # "Flock"
  confirmed: true
  notes: >
    The Jan 15 item was listed under Ongoing Business, and a 240-day sweep of every
    body's agendas (titles and agenda notes) found its first appearance: item 11.A on
    the Sept 18, 2025 regular council agenda (CivicClerk item 2025-606). Nothing else
    matched between then and Jan 15.

