e and ratify the Personnel Report actions.\u003C/p>", [], [], {"id": 178, "text": 179, "description": 180, "is_private": 25, "order": 82, "logical_id": 178, "uploads": 181, "agenda": 203}, 4650895, "Approval of Supplemental Materials", "\u003Cp>Title:  Death of the Author\u003C/p>\u003Cp>Publisher: Harper Collins\u003C/p>\u003Cp>Type: Supplemental book\u003C/p>\u003Cp>Course: English/Mythology &amp; Folklore\u003C/p>\u003Cp>\u003C/p>\u003Cp>Title:&nbsp; The Marrow Thieves\u003C/p>\u003Cp>Publisher: Cormorant Books Canada\u003C/p>\u003Cp>Type: Supplemental book\u003C/p>\u003Cp>Course: English/World Literature\u003C/p>\u003Cp>\u003C/p>\u003Cp>Title:&nbsp; Monkey King: Journey to the West\u003C/p>\u003Cp>Publisher: Penguin Classics\u003C/p>\u003Cp>Type: Supplemental book\u003C/p>\u003Cp>Course: English/Mythology &amp; Folklore\u003C/p>\u003Cp>\u003C/p>\u003Cp>\u003Cstrong>Recommended Action:\u003C/strong>\u003C/p>\u003Cp>Approve Supplemental materials.\u003C/p>", [182, 189, 196], {"id": 183, "filename": 184, "name": 184, "attached_link": 31, "file": 185, "title": 184, "uuid": 186, "preSignedUrl": 188}, 1382430, "Death of the Author.pdf", "1382430--3ae104a2-2ca5-47a9-9d9e-28c9d173898c.pdf", {"short_slug": 187}, "2034de9f", "https://boardable-production.s3.amazonaws.com/43248/pdfs/3812205.pdf?X-Amz-Expires=1200", {"id": 190, "filename": 191, "name": 191, "attached_link": 31, "file": 192, "title": 191, "uuid": 193, "preSignedUrl": 195}, 1382431, "The Marrow Thieves.pdf", "1382431--04f80193-53fb-42b5-bfc0-7712c57a9b51.pdf", {"short_slug": 194}, "b73aa860", "https://boardable-production.s3.amazonaws.com/43248/pdfs/3812206.pdf?X-Amz-Expires=1200", {"id": 197, "filename": 198, "name": 198, "attached_link": 31, "file": 199, "title": 198, "uuid": 200, "preSignedUrl": 202}, 1382432, "Monkey King Journey to the West.pdf", "1382432--0e586e59-e123-47bf-a97c-3fcf7edaa9b7.pdf", {"short_slug": 201}, "41800141", "https://boardable-production.s3.amazonaws.com/43248/pdfs/3812207.pdf?X-Amz-Expires=1200", [], {"id": 205, "text": 206, "description": 207, "is_private": 25, "order": 88, "logical_id": 205, "uploads": 208, "agenda": 209}, 4644415, "Approval of Purchase Orders from October 1, 2026 Through October 14, 2026 Regarding Proposed Expenditures or Expenditure of Budgeted Funds", "\u003Cp>A list of the purchase orders generated from October 1, 2026 through October 14, 2026 is available in the Superintendent's Office for review by the Board and public during the October 20, 2026 Board meeting, as well as via this link: \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" class=\"text-primary underline cursor-pointer\" href=\"https://tinyurl.com/5hrxyk25\">https://tinyurl.com/5hrxyk25\u003C/a>.  The list indicates purchase order number, date of issuance, name of vendor, purpose, and amount encumbered for each purchase order.\u003C/p>\u003Cp>\u003C/p>\u003Cp>\u003Cstrong>Recommended Action:\u003C/strong>\u003C/p>\u003Cp>Approve purchase orders from October 1, 2026 through October 14, 2026 regarding proposed expenditures or expenditure of budgeted funds.\u003C/p>", [], [], {"id": 211, "text": 212, "description": 213, "is_private": 25, "order": 104, "logical_id": 211, "uploads": 214, "agenda": 222}, 4650910, "Approval of the FUHSD Federal Addendum for Title I, II, III and IV", "\u003Cp>The Local Control Accountability Plan (LCAP) Federal Addendum is meant to supplement the LCAP to ensure that eligible Districts have the opportunity to meet the provisions of the Every Student Succeeds Act (ESSA). California\u2019s ESSA State Plan significantly shifts the state\u2019s approach to the utilization of federal resources in support of underserved student groups. The LCAP Federal Addendum provides Districts with the opportunity to document their approach to maximizing the impact of federal investments in support of underserved students. In the FUHSD, Title I, II, III, and IV funds are utilized in support of students who are unhoused, under-resourced, foster youth, English Language Learners and migrant students. The Federal Addendum addresses how parents, teachers and administrators work together to identify students for targeted assistance as well as how these efforts are in coordination with our partnership with the Foothill-De Anza Community College District.\u003C/p>\u003Cp>\u003C/p>\u003Cp>\u003Cstrong>Recommended Action\u003C/strong>:  Approve the FUHSD Federal Addendum for Title I, II, III, and IV\u003C/p>", [215], {"id": 216, "filename": 217, "name": 217, "attached_link": 31, "file": 218, "title": 217, "uuid": 219, "preSignedUrl": 221}, 1382434, "2026_FUHSD_LCAP_FederalAddendum.pdf", "1382434--b7670ce1-e0b6-43bc-a5e4-600e7517436d.pdf", {"short_slug": 220}, "8aec885f", "https://boardable-production.s3.amazonaws.com/43248/pdfs/3812217.pdf?X-Amz-Expires=1200", [], {"id": 224, "text": 225, "description": 31, "is_private": 25, "order": 226, "logical_id": 224, "uploads": 227, "agenda": 228}, 4642332, "TEACHING AND LEARNING", 11, [], [229, 270], {"id": 230, "text": 231, "description": 232, "is_private": 25, "order": 25, "logical_id": 230, "uploads": 233, "agenda": 269}, 4651063, "Report:  AB 2555 and Reclassification Process", "\u003Cp>Under AB 2555, signed by California Governor Gavin Newsom on September 27, 2026, and effective immediately, English learner students are reclassified as fluent English proficient (RFEP) when they achieve an Overall Performance Level 4 on the Summative English Language Proficiency Assessments for California (ELPAC) or an Overall Performance Level 3 on the Summative Alternate ELPAC. The qualifying assessment score is now the sole criterion for reclassification. The law eliminates three previously required criteria: teacher evaluation, parent opinion and consultation, and comparison of the student\u2019s performance in basic skills with that of English-proficient students of the same age.\u003C/p>\u003Cp>\u003C/p>\u003Cp>\u003Cstrong>Recommended Action:\u003C/strong>\u003C/p>\u003Cp>No action needed.\u003C/p>\u003Cp>\u003C/p>", [234, 241, 248, 255, 262], {"id": 235, "filename": 236, "name": 236, "attached_link": 31, "file": 237, "title": 236, "uuid": 238, "preSignedUrl": 240}, 1382485, "AB2555 Board Memo.pdf", "1382485--2016d438-ff06-4ab0-aadb-d49d121a35db.pdf", {"short_slug": 239}, "5759e4d7", "https://boardable-production.s3.amazonaws.com/43248/pdfs/3812312.pdf?X-Amz-Expires=1200", {"id": 242, "filename": 243, "name": 243, "attached_link": 31, "file": 244, "title": 243, "uuid": 245, "preSignedUrl": 247}, 1382486, "EL Form 9 Reclassfication Letter English.docx.pdf", "1382486--2ee133b7-2a64-4d19-a5a7-c663f7432e08.pdf", {"short_slug": 246}, "7b0772c3", "https://boardable-production.s3.amazonaws.com/43248/pdfs/3812313.pdf?X-Amz-Expires=1200", {"id": 249, "filename": 250, "name": 250, "attached_link": 31, "file": 251, "title": 250, "uuid": 252, "preSignedUrl": 254}, 1382487, "EL_Form_9_Reclassification_Letter_Traditional_Chinese.docx", "1382487--1361b09c-14a4-4578-94e9-835c8d0d78c6.docx", {"short_slug": 253}, "6f444330", "https://boardable-production.s3.amazonaws.com/43248/pdfs/3812314.pdf?X-Amz-Expires=1200", {"id": 256, "filename": 257, "name": 257, "attached_link": 31, "file": 258, "title": 257, "uuid": 259, "preSignedUrl": 261}, 1382488, "EL_Form_9_Reclassification_Letter_Simplified_Chinese.docx", "1382488--93e28721-3991-4946-b860-94284b605c7d.docx", {"short_slug": 260}, "086d63c8", "https://boardable-production.s3.amazonaws.com/43248/pdfs/3812316.pdf?X-Amz-Expires=1200", {"id": 263, "filename": 264, "name": 264, "attached_link": 31, "file": 265, "title": 264, "uuid": 266, "preSignedUrl": 268}, 1382489, "EL_Form_9_Reclassification_Letter_Spanish.docx", "1382489--fba13aeb-c794-49e5-bc23-626e95528601.docx", {"short_slug": 267}, "9b3dae2f", "https://boardable-production.s3.amazonaws.com/43248/pdfs/3812315.pdf?X-Amz-Expires=1200", [], {"id": 271, "text": 272, "description": 24, "is_private": 25, "order": 37, "logical_id": 271, "uploads": 273, "agenda": 288}, 4661207, "Summer School 2026 Report", [274, 281], {"id": 275, "filename": 276, "name": 276, "attached_link": 31, "file": 277, "title": 276, "uuid": 278, "preSignedUrl": 280}, 1387651, "Memo Update on Interventions and Summer Academy.docx", "1387651--818ae487-42e6-4e92-a083-d5a64e1302fc.docx", {"short_slug": 279}, "35aa0dbd", "https://boardable-production.s3.amazonaws.com/43248/pdfs/3819935.pdf?X-Amz-Expires=1200", {"id": 282, "filename": 283, "name": 283, "attached_link": 31, "file": 284, "title": 283, "uuid": 285, "preSignedUrl": 287}, 1387652, "Summer School Board Presentation 2026.pdf", "1387652--fe355097-908c-4997-8816-1eba72dc1c9b.pdf", {"short_slug": 286}, "c87b1a11", "https://boardable-production.s3.amazonaws.com/43248/pdfs/3819936.pdf?X-Amz-Expires=1200", [], {"id": 290, "text": 291, "description": 31, "is_private": 25, "order": 292, "logical_id": 290, "uploads": 293, "agenda": 294}, 4642333, "BOND AND FACILITIES - No Agenda Items", 12, [], [], {"id": 296, "text": 297, "description": 31, "is_private": 25, "order": 298, "logical_id": 296, "uploads": 299, "agenda": 300}, 4642334, "BOND AND FACILITIES CONSENT AGENDA", 13, [], [301, 314, 327, 340], {"id": 302, "text": 303, "description": 304, "is_private": 25, "order": 25, "logical_id": 302, "uploads": 305, "agenda": 313}, 4644454, "Authorization to File a Notice of Completion for the District Wide Athletic Fields Replacements Project", "\u003Cp>The District Wide Athletic Fields Replacements Project has been completed and it is appropriate at this time for the District to file a Notice of Completion for the following:\u003C/p>\u003Cp>\u003C/p>\u003Cp>Robert A. Bothman Construction\u003C/p>\u003Cp>District Wide Athletic Fields Replacements Project\u003C/p>\u003Cp>\u003C/p>\u003Cp>\u003Cstrong>Recommended Action:\u003C/strong>\u003C/p>\u003Cp>Authorize the District to File a Notice of Completion for the District Wide Athletic Fields Replacements Project.\u003C/p>\u003Cp>\u003C/p>", [306], {"id": 307, "filename": 308, "name": 308, "attached_link": 31, "file": 309, "title": 308, "uuid": 310, "preSignedUrl": 312}, 1384894, "NOC_DW Athletic Field Repairs & Replacement_Final.pdf", "1384894--901a5fa8-f7c7-4f12-b1ae-6bbde5cb886c.pdf", {"short_slug": 311}, "b001ee25", "https://boardable-production.s3.amazonaws.com/43248/pdfs/3815943.pdf?X-Amz-Expires=1200", [], {"id": 315, "text": 316, "description": 317, "is_private": 25, "order": 37, "logical_id": 315, "uploads": 318, "agenda": 326}, 4644600, "Approval of Agreement with HazMat Doc for Pre-Demolition Survey Services for the Homestead High School Buildings C and L Replacement Project", "\u003Cp>As we proceed with the design and upcoming construction of the new buildings that will replace current buildings C and L at Homestead High School, we are required to do a survey of hazardous materials before demolition can begin. \u003C/p>\u003Cp>\u003C/p>\u003Cp>HazMat Doc has submitted a proposal and we have worked with them on past projects and have been pleased with their services. The scope of work includes the following:\u003C/p>\u003Cp>\u00b7\tAsbestos Inspection technician time\u003C/p>\u003Cp>\u00b7\tAsbestos sample collection and laboratory analysis\u003C/p>\u003Cp>\u00b7\tLead Sampling by XRF testing and analysis\u003C/p>\u003Cp>\u00b7\tLead in paint sample collection and laboratory analysis\u003C/p>\u003Cp>\u00b7\tFinal Report\u003C/p>\u003Cp>\u00b7\tBiddable Construction Specifications and Scope of Work for Asbestos and Lead Abatement (if needed)\u003C/p>\u003Cp>\u003C/p>\u003Cp>The form of this agreement has been approved by legal counsel. This is a Measure G funded project.\u003C/p>\u003Cp>\u003Cstrong>Recommended Action:\u003C/strong>\u003C/p>\u003Cp>Approve Agreement with HazMat Doc for Pre-Demolition Survey Services Homestead High School Buildings C and L Replacement Project for time and materials, not to exceed $33,340.\u003C/p>", [319], {"id": 320, "filename": 321, "name": 321, "attached_link": 31, "file": 322, "title": 321, "uuid": 323, "preSignedUrl": 325}, 1384151, "HazMat_HHS H New C & L Buildings_Pre-Demolition Survey_Agrmnt_$33,340_Final.pdf", "1384151--b679cc43-2728-4c00-b405-027085e3723a.pdf", {"short_slug": 324}, "a7faef19", "https://boardable-production.s3.amazonaws.com/43248/pdfs/3815052.pdf?X-Amz-Expires=1200", [], {"id": 328, "text": 329, "description": 330, "is_private": 25, "order": 60, "logical_id": 328, "uploads": 331, "agenda": 339}, 4644551, "Approval of Agreement with Alpha Land Surveys, Inc. for Topographic Surveying Services for the Homestead High School Buildings C and L Replacement Project", "\u003Cp>As part of the Homestead High School Buildings C and L Replacement project, an additional topographic survey is needed so that the Architect, Quattrocchi Kwok Architects, can continue working on the architectural plans and drawings for submission to the Division of the State Architect (DSA) for project approval. With the addition of a proposed covered bike parking area near the athletic fields, supplemental surveying is needed to document existing site conditions and verify the accessible path of travel.\u003C/p>\u003Cp>\u003C/p>\u003Cp>Alpha Land Surveys, Inc. has provided a reasonable proposal for the following scope of work:\u003C/p>\u003Cp>\u00b7\tSurvey and mapping of existing site conditions, including structures, floor elevations, trees and drip lines, decks, walls, fences, hardscape, paths of travel, planters, ramps, curbs and gutters, parking spaces, benches, and other pertinent topographic and planimetric features.\u003C/p>\u003Cp>\u00b7\tLocation of utilities based on surface evidence and incorporation of underground utilities into the topographic base map when marked prior to the site visit.\u003C/p>\u003Cp>\u00b7  Verification of existing handrails and projections.\u003C/p>\u003Cp>\u00b7\tPreparation of topographic map showing the items measured.\u003C/p>\u003Cp>\u003C/p>\u003Cp>Alpha Land Surveys, Inc. can meet our timeline, has worked with the District on past projects, and we have been pleased with their services.\u003C/p>\u003Cp>\u003C/p>\u003Cp>The form of this agreement has been approved by legal counsel. This is a Measure G funded project.\u003C/p>\u003Cp>\u003Cstrong>Recommended Action:\u003C/strong>\u003C/p>\u003Cp>Approve Agreement with Alpha Land Surveys, Inc. for Topographic Surveying Services for the Homestead High School Buildings C and L Replacement Project in the amount of $4,800.\u003C/p>", [332], {"id": 333, "filename": 334, "name": 334, "attached_link": 31, "file": 335, "title": 334, "uuid": 336, "preSignedUrl": 338}, 1384855, "Alpha Land Surveys, Inc._HHS H New C & L Buildings_Agrmnt_Agrmnt_$4,800_Final.pdf", "1384855--323a1e79-dba2-4973-ba8c-6bfba402c2ef.pdf", {"short_slug": 337}, "3b3e6144", "https://boardable-production.s3.amazonaws.com/43248/pdfs/3815854.pdf?X-Amz-Expires=1200", [], {"id": 341, "text": 342, "description": 343, "is_private": 25, "order": 66, "logical_id": 341, "uploads": 344, "agenda": 352}, 4644522, "Ratification of Agreement with Thrasher Termite & Pest Control, Inc. for the Lynbrook High School Building 600 Classroom Modernization Project", "\u003Cp>As part of the classroom modernization of building 600 at Lynbrook High School, active termite damage was discovered during construction. \u003C/p>\u003Cp>\u003C/p>\u003Cp>District staff solicited a proposal from Thrasher Termite for the following scope of work:\u003C/p>\u003Cp>\t\u00b7\tSite inspection and investigation\u003C/p>\u003Cp>\t\u00b7\tTermite treatment at impacted areas\u003C/p>\u003Cp>\u003C/p>\u003Cp>Thrasher Termite has provided excellent services in the past and is able to meet our construction timeline by scheduling this work to begin promptly. Due to the urgency and nature of these services, we are asking the Board of Trustees to ratify this agreement as District Staff authorized this work in an effort to prevent delays to the construction schedule.\u003C/p>\u003Cp>\u003C/p>\u003Cp>The form of this agreement has been approved by legal counsel. This is a Measure G funded project.\u003C/p>\u003Cp>\u003Cstrong>Recommended Action:\u003C/strong>\u003C/p>\u003Cp>Ratify Agreement with Thrasher Termite &amp; Pest Control, Inc. for the Lynbrook High School Building 600 Classroom Modernization Project in the amount, not to exceed $1,275.\u003C/p>", [345], {"id": 346, "filename": 347, "name": 347, "attached_link": 31, "file": 348, "title": 347, "uuid": 349, "preSignedUrl": 351}, 1384144, "Thrasher Termite & Pest Control_LHS Bldg 600 Mod._Construc Agrmnt_$1,275_Final.pdf", "1384144--21ad1103-e13d-43b6-90c6-ca96ae815d4b.pdf", {"short_slug": 350}, "29cca734", "https://boardable-production.s3.amazonaws.com/43248/pdfs/3815040.pdf?X-Amz-Expires=1200", [], {"id": 354, "text": 355, "description": 31, "is_private": 25, "order": 356, "logical_id": 354, "uploads": 357, "agenda": 358}, 4642335, "BUSINESS AND FINANCE - No Agenda Items", 14, [], [], {"id": 360, "text": 361, "description": 31, "is_private": 25, "order": 362, "logical_id": 360, "uploads": 363, "agenda": 364}, 4642336, "HUMAN RESOURCES", 15, [], [365, 385], {"id": 366, "text": 367, "description": 368, "is_private": 25, "order": 25, "logical_id": 366, "uploads": 369, "agenda": 384}, 4661350, "Approval of Revised Director and Coordinator of Human Resources Job Descriptions", "\u003Cp>These two job descriptions are being revised in order to update their roles and responsibilities in preparation for the upcoming posting of a Coordinator of Human Resources position.\u003C/p>\u003Cp>\u003C/p>\u003Cp>\u003C/p>\u003Cp>\u003Cstrong>Recommended Action:\u003C/strong>\u003C/p>\u003Cp> Approve the revised Job Descriptions for Director and Coordinator of Human Resources\u003C/p>\u003Cp>\u003C/p>\u003Cp>\u003C/p>", [370, 377], {"id": 371, "filename": 372, "name": 372, "attached_link": 31, "file": 373, "title": 372, "uuid": 374, "preSignedUrl": 376}, 1390595, "Draft of Coordinator of HR, Oct 2026.docx - Google Docs.pdf", "1390595--f
